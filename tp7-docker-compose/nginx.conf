events {}

http {
  # "app" est résolu par le DNS interne de Docker vers TOUTES les répliques
  upstream visits_app {
    server app:3000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://visits_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
